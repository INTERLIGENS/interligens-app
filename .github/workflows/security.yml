name: Security Gates

on:
  push:
    # `feat/cc-offline-**` : la convention de branche imposée par
    # scripts/guard-offline.sh. Une branche de chantier doit pouvoir prouver un
    # run CI complet AVANT sa PR. Sur un évènement `push`, GitHub exécute le
    # fichier de workflow DE LA BRANCHE POUSSÉE — c'est le seul déclencheur qui
    # fonctionne sans passer d'abord par `main`. (`workflow_dispatch`,
    # ci-dessous, exige que le déclencheur existe déjà sur la branche par
    # défaut : inutilisable tant que ce fichier n'est pas sur `main`.)
    #
    # `hotfix/**` : la voie de maintenance du guard passe par là.
    branches: [main, master, develop, 'feat/cc-offline-**', 'hotfix/**']
  pull_request:
    branches: [main, master, develop]
  # Lancement manuel (`gh workflow run security.yml --ref <branche>`).
  # Ne devient effectif qu'une fois ce fichier présent sur `main`.
  workflow_dispatch:

# Annule les runs en cours si un nouveau push arrive sur la même branche
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. Secret scanning (Gitleaks) ────────────────────────────────────────────
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # historique complet pour scanner tous les commits PR

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # La config est lue depuis .gitleaks.toml à la racine

  # ── 2. SAST — Semgrep ────────────────────────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run Semgrep (TypeScript + OWASP)
        run: >
          semgrep scan
          --config p/typescript
          --config p/react
          --config p/owasp-top-ten
          --config p/secrets
          --error
          --quiet
          --exclude 'node_modules/**'
          --exclude '.next/**'
          --exclude 'backups/**'
          --exclude '.backup_*/**'
          --exclude '**/*.test.ts'
          --exclude '**/*.test.tsx'
          .

  # ── 3. Dependency audit ───────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # LE VERDICT BLOQUANT DU JOB — une seule étape, et elle bloque.
      #
      # Il y avait ici DEUX étapes : `pnpm audit --audit-level=moderate`, qui
      # portait le verdict, et le classement, en `continue-on-error`. Mesuré :
      # 112 advisories, dont 25 seulement atteignent le code livré en high+.
      # Le verdict indistinct était rouge en permanence depuis le 2026-06-26 —
      # zéro run vert sur 200. Un garde toujours rouge ne signale plus rien : une
      # advisory NOUVELLE y était indiscernable des 112 du bruit de fond.
      #
      # Le verdict passe donc au cliquet — `compare()` de ratchet-check.mjs,
      # importé tel quel — opposé à `audit-baseline.json`, versionné. La dette
      # historique acceptée reste acceptée ; toute advisory prod high+ qui n'est
      # PAS dans la baseline fait échouer le job. Rien n'est masqué : le tableau
      # complet des 112 (prod/dev/inconnu × critical→info) est imprimé à chaque
      # run, et `pnpm audit --json` reste la source, lue par le script.
      #
      # Ce n'est PAS un assouplissement : avant, 0 advisory nouvelle était
      # détectable ; maintenant, une seule fait rougir le job. Le durcissement
      # total (`--fail-on-prod`, zéro advisory prod high+) reste la phase 3.
      - name: Dependency audit — cliquet sur la dette atteignant le code livré
        run: pnpm audit:classify --fail-on-new

  # ── 4. Quality gates ──────────────────────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    # ┌──────────────────────────────────────────────────────────────────────┐
    # │ VALEURS FACTICES DE CI — ce bloc n'existe QUE dans ce fichier        │
    # └──────────────────────────────────────────────────────────────────────┘
    #
    # src/lib/config/env.ts exige CINQ variables dès que NODE_ENV=production,
    # et lève à l'import. Le job n'en fournissait qu'une (DATABASE_URL, sur la
    # seule étape Build) : `Build` mourait sur `Missing required env var in
    # prod: ADMIN_TOKEN`, avant même d'atteindre les quatre suivantes.
    #
    # `Tests` tombait sur la même cause par un autre chemin : sans DATABASE_URL,
    # `new PrismaClient({ datasources: { db: { url: process.env.DATABASE_URL } } })`
    # jette `PrismaClientConstructorValidationError` à l'import du module — 17
    # fichiers de test non collectés, 5 tests en échec. En local le poste a un
    # .env.local : la même suite y est verte depuis toujours. C'est exactement
    # l'écart qui rendait la CI illisible.
    #
    # CE QUI N'EST PAS FAIT ICI, ET NE DOIT PAS L'ÊTRE :
    #   · aucun fallback applicatif — env.ts n'est pas touché, requireInProd()
    #     lève toujours ; en production réelle le fail-fast est inchangé ;
    #   · aucune valeur de production — rien ici n'existe dans Vercel ni dans un
    #     .env ; ces chaînes ne sont des identifiants de RIEN ;
    #   · aucune connexion possible — `.invalid` est un TLD réservé (RFC 2606),
    #     il ne résout nulle part et ne peut être enregistré par personne.
    #
    # NODE_ENV n'est PAS ici, volontairement : au niveau du job il ferait sauter
    # les devDependencies de `pnpm install` et changerait le comportement des
    # tests. Il reste sur la seule étape qui en a besoin, `Build`.
    env:
      DATABASE_URL: postgresql://ci:ci@db.invalid:5432/none?sslmode=disable
      ADMIN_TOKEN: ci-not-a-secret
      VAULT_AUDIT_SALT: ci-not-a-secret
      ADMIN_BASIC_USER: ci
      ADMIN_BASIC_PASS: ci-not-a-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DÉCOUVERT PAR LE RÉORDONNANCEMENT — sans cette étape, `Type check`,
      # `Tests` et `Build` sont tous les trois impossibles en CI.
      #
      # pnpm n'exécute pas les scripts de post-installation des dépendances
      # ("Ignored build scripts: @prisma/client"), donc le client Prisma n'est
      # jamais généré sur le runner. `@prisma/client` n'exporte alors NI
      # `PrismaClient` NI `Prisma`, et tsc rend 523 erreurs — dont 316 `TS7006`
      # qui ne sont que la retombée des types non résolus. En local le client
      # existe déjà dans le magasin pnpm, ce qui rendait le typecheck vert au
      # poste et rouge nulle part, puisque la CI ne l'a jamais exécuté.
      #
      # `pnpm prisma:generate` — jamais `npx prisma generate` : sans le flag
      # `--schema prisma/schema.prod.prisma`, Prisma lit le schéma SQLite de
      # développement et produit un client incomplet.
      #
      # `generate` ne se connecte à aucune base : il lit le schéma et écrit
      # dans node_modules. Aucune variable d'environnement n'est posée ici.
      - name: Generate Prisma client
        id: prisma
        run: pnpm prisma:generate

      # ORDRE VOLONTAIRE — ne pas remettre `Lint` en tête.
      #
      # Les étapes d'un job GitHub Actions s'exécutent en séquence et la
      # première qui échoue met les suivantes en `skipped`. Tant que `Lint`
      # était la première étape, son échec (1 249 problèmes de dette legacy,
      # dont 683 `no-explicit-any` qui ne cassent aucune compilation)
      # empêchait `Type check`, `Tests` et `Build` de tourner : sur les 15
      # derniers runs de `main`, ces trois étapes sont `skipped` — la CI n'a
      # jamais exécuté les 3 016 tests ni le build.
      #
      # `Lint` passe donc en dernier : les trois gates qui protègent une
      # conclusion publiée tournent d'abord, quel que soit l'état du lint.
      # `Lint` reste bloquant pour le job — c'est la politique actuelle, et
      # la changer (avertissement plutôt que blocage, ou ESLint sur le seul
      # diff) est une décision produit, pas un réordonnancement.
      # `if: !cancelled() && steps.prisma.outcome == 'success'` sur les QUATRE
      # gates : aucune ne peut plus en masquer une autre.
      #
      # Le réordonnancement seul ne suffisait pas. Au premier run où `Type
      # check` a pu s'exécuter, il a échoué (client Prisma non généré) et a
      # remis `Tests`, `Build` et `Lint` en `skipped` — le défaut d'origine
      # avait simplement changé de place. Une exécution indépendante par gate
      # donne, en un seul run, l'état réel des quatre.
      #
      # Ça ne masque RIEN : chaque étape reste bloquante pour le job, et le
      # job reste rouge si l'une échoue. La condition n'exempte que le cas où
      # `Install` ou `Generate Prisma client` a échoué — là, les quatre gates
      # n'auraient aucun sens.
      #
      # L'ordre reste Type check → Tests → Build → Lint : le plus informatif
      # d'abord, le plus bruyant en dernier, pour la lecture du journal.
      - name: Type check
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: pnpm typecheck

      - name: Tests
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: pnpm test

      # ┌──────────────────────────────────────────────────────────────────┐
      # │ CE QUE CE GATE PROUVE, ET CE QU'IL NE PROUVE PAS                 │
      # └──────────────────────────────────────────────────────────────────┘
      #
      # IL PROUVE : le projet compile, et le prérendu s'exécute jusqu'au bout
      # sans lever — types résolus, imports valides, `Collecting page data`
      # traversé pour chaque route, pages statiques rendues.
      #
      # IL NE PROUVE PAS que l'artefact prérendu est CORRECT.
      #
      # `DATABASE_URL` ci-dessous désigne un hôte inexistant. Une page
      # interroge réellement la base pendant `next build` — mesuré, lecture
      # statique en docs/prep/RAPPORT_D1_ACCES_BASE_BUILD.md :
      #
      #   src/app/en/news/page.tsx   3 requêtes Prisma (signal,
      #                              socialPostCandidate, kolProfile), chacune
      #                              sous `try { } catch { }` qui AVALE l'erreur.
      #
      # En CI, ces trois requêtes échouent, silencieusement, par construction.
      # `/en/news` se prérend donc VIDE. Le build est vert et la page est fausse.
      # Ce n'est pas grave ici — l'artefact de CI n'est jamais déployé, la
      # production est reconstruite par `npx vercel --prod` avec le vrai
      # environnement — mais ça borne ce que le vert signifie.
      #
      # CONSÉQUENCE À RETENIR : une régression qui ferait sortir une requête de
      # son `try/catch` resterait INVISIBLE à ce gate. Il attrape ce qui ne
      # compile pas et ce qui lève ; il n'attrape pas ce qui échoue en silence.
      #
      # Les cinq variables que le fail-fast de env.ts exige sont posées au
      # niveau du JOB (voir le bloc `env:` en tête, et pourquoi elles y sont
      # factices). NODE_ENV reste ici : c'est lui qui ARME ce fail-fast, et le
      # poser plus haut casserait `pnpm install` et fausserait les tests.
      - name: Build
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Lint
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: pnpm lint:ci

      # Le cliquet. Il compare DEUX BASELINES versionnées, jamais la sortie
      # d'ESLint : le verdict ne dépend donc ni de la version d'ESLint, ni de
      # l'ordre des fichiers, ni du parallélisme. Phase 1 : `continue-on-error`,
      # le filet se voit sans bloquer personne. Le rendre required est la
      # phase 3, et c'est une décision distincte.
      #
      # `github.base_ref` NE PASSE PAS par `${{ }}` dans le `run:`. Une donnée
      # du contexte `github` interpolée dans un script shell est substituée AVANT
      # que bash ne voie la ligne : un nom de branche construit pour ça exécute
      # ce qu'il veut sur le runner, avec les secrets du job. C'est la règle
      # Semgrep yaml.github-actions.security.run-shell-injection — l'unique
      # finding SAST de ce dépôt, et elle était dans la CI elle-même.
      # La valeur transite par `env:` et n'est lue que citée : "$BASE_REF".
      - name: CI Ratchet — la dette de lint ne croît pas
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm ratchet:check "origin/$BASE_REF"

  # ── 5. Job récapitulatif (branch protection: 1 seul job à surveiller) ────────
  all-gates-passed:
    name: All Security Gates Passed
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, audit, quality]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.gitleaks.result }}"  != "success" ]] ||
             [[ "${{ needs.semgrep.result }}"   != "success" ]] ||
             [[ "${{ needs.audit.result }}"     != "success" ]] ||
             [[ "${{ needs.quality.result }}"   != "success" ]]; then
            echo "❌ Un ou plusieurs security gates ont échoué."
            exit 1
          fi
          echo "✅ Tous les security gates sont verts."
